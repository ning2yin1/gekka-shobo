<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#202D4D" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta
      name="description"
      content="月明かりの書房に、台湾華語を一語ずつ。オフラインで使える自分だけの単語帳。"
    />
    <title>月華書房 · Gekka Shobo</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="sky" aria-hidden="true"></div>
    <div class="shell">
      <header class="masthead">
        <a href="#home" class="brand"
          ><span class="brand-mark" aria-hidden="true">☾</span
          ><span>月華書房<small>GEKKA SHOBO</small></span></a
        ><span class="header-note">一語ずつ、月の栞を。</span>
      </header>
      <main id="app" tabindex="-1"><p>書房を開いています…</p></main>
      <nav class="bottom-nav" aria-label="メイン">
        <a href="#home"
          ><svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M19 15a8 8 0 0 1-10-10A8 8 0 1 0 19 15Z" /></svg
          ><span>書房</span></a
        >
        <a href="#list"
          ><svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 5h16v15H4zM7 9h10M7 13h10M7 17h7M7 2v5M17 2v5" /></svg
          ><span>単語一覧</span></a
        >
        <a href="#add"
          ><svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 4v16M4 12h16" /></svg
          ><span>ことばを追加</span></a
        >
        <a href="#settings"
          ><svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="3" />
            <path
              d="m10 3 4 0 1 3 3 1 3 3-2 3 0 3-3 2-3-1-3 2-3-2 0-3-2-3 2-3 3-1Z"
            /></svg
          ><span>設定</span></a
        >
      </nav>
    </div>
    <div id="toast" role="status" aria-live="polite"></div>
    <dialog id="confirm-dialog">
      <form method="dialog">
        <h2 id="confirm-title">確認</h2>
        <p id="confirm-message"></p>
        <div class="actions">
          <button value="cancel">キャンセル</button
          ><button value="ok" class="primary">実行する</button>
        </div>
      </form>
    </dialog>
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
