<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#293B64" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta
      name="description"
      content="月明かりの書房に、台湾華語を一語ずつ。オフラインで使える自分だけの単語帳。"
    />
    <title>月華書房 · Gekka Shobo</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="sky" aria-hidden="true"></div>
    <div class="shell">
      <header class="masthead">
        <a href="#home" class="brand"
          ><span class="brand-mark" aria-hidden="true">☾</span
          ><span>月華書房<small>GEKKA SHOBO</small></span></a
        ><span class="header-note">一語ずつ、月の栞を。</span>
      </header>
      <main id="app" tabindex="-1"><p>書房を開いています…</p></main>
      <nav class="bottom-nav" aria-label="メイン">
        <a href="#home">☾ <span>書房</span></a
        ><a href="#list">▤ <span>単語一覧</span></a
        ><a href="#add">＋ <span>ことばを追加</span></a
        ><a href="#settings">⚙ <span>設定</span></a>
      </nav>
    </div>
    <div id="toast" role="status" aria-live="polite"></div>
    <dialog id="confirm-dialog">
      <form method="dialog">
        <h2 id="confirm-title">確認</h2>
        <p id="confirm-message"></p>
        <div class="actions">
          <button value="cancel">キャンセル</button
          ><button value="ok" class="primary">実行する</button>
        </div>
      </form>
    </dialog>
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
